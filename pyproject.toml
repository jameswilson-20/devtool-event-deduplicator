[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devtool-event-deduplicator"
version = "0.1.0"
description = "Semantic near-duplicate decisions for build, release, and diagnostic events"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.50,<2",
  "pydantic>=2.9,<3",
  "requests>=2.32,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
devtool-dedup = "devtool_dedup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devtool_dedup"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
